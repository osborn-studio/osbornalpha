name: Quote service alert

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quote-service-alert
  cancel-in-progress: false

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Vercel reaches local DataGateway/Wind
        run: |
          set -euo pipefail
          payload="$(curl --fail-with-body --retry 2 --retry-all-errors --max-time 30 --max-filesize 2097152 \
            "https://osbornalpha.com/api/quote/batch?tickers=600519.SH,AAPL&_=$(date +%s)")"
          # Fixed-field classification keeps availability and preferred source separate.
          # Never print the raw quote/provider payload to Actions logs.
          python3 scripts/quotes/probe_quality.py <<< "$payload"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate the previous 15-minute quote window
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::error title=Missing CRON_SECRET::Add the production CRON_SECRET value to the repository Actions secrets before enabling this check."
            exit 1
          fi
          curl --fail-with-body --retry 2 --retry-all-errors --max-time 60 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            https://osbornalpha.com/api/cron/alerts/quotes
