name: Quote service alert

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quote-service-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Vercel reaches local DataGateway/Wind
        run: |
          set -euo pipefail
          payload="$(curl --fail-with-body --retry 2 --retry-all-errors --max-time 30 \
            "https://osbornalpha.com/api/quote/batch?tickers=600519.SH,AAPL&_=$(date +%s)")"
          if ! jq -e '
            .meta.failed == 0 and
            .meta.selected_sources["600519.SH"] == "datagateway-wind" and
            .meta.selected_sources["AAPL"] == "datagateway-wind"
          ' <<< "$payload" >/dev/null; then
            echo "DataGateway/Wind is not the selected quote source for all probe tickers."
            echo "$payload"
            exit 1
          fi

      - name: Evaluate the previous 15-minute quote window
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::error title=Missing CRON_SECRET::Add the production CRON_SECRET value to the repository Actions secrets before enabling this check."
            exit 1
          fi
          curl --fail-with-body --retry 2 --retry-all-errors --max-time 60 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            https://osbornalpha.com/api/cron/alerts/quotes
