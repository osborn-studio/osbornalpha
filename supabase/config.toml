# Supabase project config (local only — production is on supabase.com)
project_id = "stock-monitor"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "https://osbornalpha.com/auth/callback", "https://www.osbornalpha.com/auth/callback", "https://*.vercel.app/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.rate_limit]
email_sent = 30

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = true
max_frequency = "60s"

# Production SMTP is applied selectively through the Supabase Management API.
# Do not run `supabase config push` against production with local-only URLs.
